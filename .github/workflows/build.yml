name: Build Windows executable

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: |
          pyinstaller --onefile --windowed --name "DofusTeam" --icon "skin\logo.ico" --add-data "skin;skin" --add-data "sounds;sounds" --hidden-import "win32gui" --hidden-import "win32con" --hidden-import "win32api" --hidden-import "win32process" --hidden-import "keyboard" --hidden-import "mouse" --hidden-import "pyautogui" --hidden-import "PIL" --hidden-import "tkinter" --hidden-import "requests" --hidden-import "pyperclip" main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DofusTeam-windows
          path: dist/DofusTeam.exe
